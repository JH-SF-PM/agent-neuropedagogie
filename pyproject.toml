[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-neuropedagogie"
version = "0.1.0"
description = "Agent expert en neuropédagogie pour analyser les vidéos de formation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.mistralai.agents]
entrypoint = "main:agent"
name = "agent-formateur-neuropedagogie"
